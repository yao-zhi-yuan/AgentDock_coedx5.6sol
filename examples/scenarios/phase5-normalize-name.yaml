apiVersion: agentdock.dev/v1alpha1
kind: HarnessRun
metadata:
  name: phase5-normalize-name

target:
  adapter: eino
  repository: examples/buggy-go-service
  revision: HEAD

task:
  prompt: |
    Fix NormalizeName so surrounding whitespace is removed before lowercasing.
  allowedPaths:
    - internal/user/

runtime:
  maxRepairRounds: 0
  timeout: 2m
  tokenBudget: 200

sandbox:
  network: none
  cpu: 1
  memory: 512Mi
  pids: 128
  commandTimeout: 60s

verification: []
faults: []
